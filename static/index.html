<!DOCTYPE html>
<html lang="uk">
<head>
   <meta charset="UTF-8">
   <title>Торговий журнал</title>
</head>
<body>
   <h1>Торговий журнал</h1>
   <p id="stats">Завантаження...</p>
   <h2>Нова угода</h2>
<form id="trade-form">
  <input id="pair" placeholder="Пара, напр. EURUSD" required>
  <input id="result" type="number" step="any" placeholder="Результат" required>
  <input id="date" type="date">
  <button type="submit">Додати</button>
</form>
<p id="msg"></p>
   <h2>Угоди</h2>
  <table border="1" cellpadding="6">
    <thead>
      <tr><th>Дата</th><th>Пара</th><th>Результат</th></tr>
    </thead>
    <tbody id="trades"></tbody>
  </table>

  <script>
    async function load() {
      const statsRes = await fetch("/stats");
      const stats = await statsRes.json();
      document.getElementById("stats").textContent =
        "Угод: " + stats.trades + " | Результат: " + stats.total + " | Winrate: " + stats.winrate + "%";

      const tradesRes = await fetch("/trades");
      const trades = await tradesRes.json();
      const tbody = document.getElementById("trades");
      tbody.innerHTML = "";

      for (const t of trades) {
        const tr = document.createElement("tr");
        for (const value of [t.trade_date, t.pair, t.result]) {
          const td = document.createElement("td");
          td.textContent = value;
          tr.appendChild(td);
        }
        tbody.appendChild(tr);
      }
    }
document.getElementById("trade-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const body = {
    pair: document.getElementById("pair").value,
    result: parseFloat(document.getElementById("result").value),
  };
  const date = document.getElementById("date").value;
  if (date) body.trade_date = date;

  const res = await fetch("/trades", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(body),
  });

  const msg = document.getElementById("msg");
  if (res.ok) {
    msg.textContent = "Угоду додано";
    e.target.reset();
    load();
  } else {
    msg.textContent = "Помилка: перевір дані";
  }
});
    load();
  </script>
</body>
</html>
